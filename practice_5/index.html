<!DOCTYPE html>

  что это документ HTML5 -->
<html lang="ru">
<head>
    <title> Калькулятор цены заказа</title>
    <script src="somestuff.js" defer></script>
</head>
<body>
    <h1> Калькулятор цены заказа</h1>
    <p> Работу выполнил Чугуй Никита, гр. 25/1 </p>

    <form action="/" method="POST">
    <div id="main-aside-wrapper">
      <main>
        <label>
        Количество товара:<br />
        <input id="goods" placeholder="Введите количество товара"/>
      </label><br />

        <label>
        Товар:<br />
        <select name="Товары">
          <option value="Значение1">Товар 1 (90)</option>
          <option value="Значение2">Товар 2 (40)</option>
        </select>
        </label>
      </main>
    <aside>
      Кнопка "Посчитать":
        <input type="submit" id="only_button" value="Посчитать" />
    </aside>
    </form>
  </div>

</body>

</html>
